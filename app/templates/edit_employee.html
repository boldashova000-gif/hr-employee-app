{% extends "base.html" %}
{% block content %}
<h2>Редактировать сотрудника</h2>
<form method="POST">
    <div class="mb-3">
        <label>ФИО</label><input type="text" name="full_name" value="{{ employee.full_name }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Должность</label><input type="text" name="position" value="{{ employee.position }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Отдел</label><input type="text" name="department" value="{{ employee.department }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Телефон</label><input type="text" name="phone" value="{{ employee.phone }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Email</label><input type="email" name="email" value="{{ employee.email }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Дата приёма</label><input type="date" name="hire_date" value="{{ employee.hire_date }}" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
